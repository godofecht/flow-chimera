name: Flow Chimera tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Flow compiler
        uses: actions/checkout@v4
        with:
          repository: flooooooooooow/flow
          path: flow-toolchain
      - name: Build and test Flow Chimera
        run: |
          ./flow-toolchain/flow version
          ./flow-toolchain/flow run src/chimera_test.flow
          ./flow-toolchain/flow run src/parity_test.flow
          ./flow-toolchain/flow run src/tool_test.flow
          ./flow-toolchain/flow run src/protocol_test.flow
          ./flow-toolchain/flow run src/ollama_embedding_test.flow
          ./flow-toolchain/flow run src/semantic_memory_test.flow
          ./flow-toolchain/flow run src/provider_test.flow
          ./flow-toolchain/flow run src/reward_test.flow
          ./flow-toolchain/flow run src/reward_persistence_test.flow
          ./flow-toolchain/flow run src/reward_persistence_corrupt_test.flow
          ./flow-toolchain/flow run src/demo.flow

      - name: Local Gemini-compatible integration
        env:
          CHIMERA_LLM_API_KEY: integration-test-key
          CHIMERA_LLM_API_URL: http://127.0.0.1:18763/generate
        run: |
          python3 tests/mock_gemini.py &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --silent --show-error --fail --retry 8 --retry-delay 1 --retry-connrefused http://127.0.0.1:18763/health
          ./flow-toolchain/flow run src/live_test.flow
          CHIMERA_TASK='Add five and ten' CHIMERA_MAX_STEPS=1 CHIMERA_SNAPSHOT=/tmp/chimera_live_session_test.bin ./flow-toolchain/flow run src/live_cli.flow
          test -s /tmp/chimera_live_session_test.bin
          rm -f /tmp/chimera_live_session_test.bin

      - name: Local Ollama-compatible embedding integration
        env:
          CHIMERA_OLLAMA_URL: http://127.0.0.1:18764/api/embed
          CHIMERA_OLLAMA_EMBED_MODEL: qwen3-embedding:0.6b
          CHIMERA_OLLAMA_GENERATE_URL: http://127.0.0.1:18764/api/generate
          CHIMERA_OLLAMA_GENERATE_MODEL: qwen2.5:7b
        run: |
          python3 tests/mock_ollama.py &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --silent --show-error --fail --retry 8 --retry-delay 1 --retry-connrefused http://127.0.0.1:18764/health
          ./flow-toolchain/flow run src/ollama_provider_test.flow
          ./flow-toolchain/flow run src/ollama_generation_test.flow
          CHIMERA_TASK="add five and ten" CHIMERA_MAX_STEPS=1 ./flow-toolchain/flow run src/ollama_cli.flow
          CHIMERA_SEMANTIC_DB=/tmp/chimera_ollama_demo_snapshot.bin ./flow-toolchain/flow run src/ollama_demo.flow
          test -s /tmp/chimera_ollama_demo_snapshot.bin
          rm -f /tmp/chimera_ollama_demo_snapshot.bin
